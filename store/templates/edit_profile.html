{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile Settings | NEXUS STORE{% endblock %}

{% block content %}
<div class="container" style="max-width: 640px; padding: 50px 20px 90px;">
  <div class="checkout-form-card" style="box-shadow: var(--shadow-glass); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 36px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(99, 102, 241, 0.12); color: var(--accent-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin: 0 0 6px 0;">
        Profile Settings
      </h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 0;">
        Update your personal details and default shipping address.
      </p>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="form-group-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="form-field">
          <label for="first_name" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">First Name</label>
          <input type="text" name="first_name" id="first_name" class="form-input" value="{{ user.first_name }}" placeholder="e.g. Alexander">
        </div>
        <div class="form-field">
          <label for="last_name" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Last Name</label>
          <input type="text" name="last_name" id="last_name" class="form-input" value="{{ user.last_name }}" placeholder="e.g. Vance">
        </div>
      </div>

      <div class="form-field" style="margin-bottom: 16px;">
        <label for="email" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Email Address</label>
        <input type="email" name="email" id="email" class="form-input" value="{{ user.email }}" required>
      </div>

      <div class="form-group-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="form-field">
          <label for="phone" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Phone Number</label>
          <input type="tel" name="phone" id="phone" class="form-input" value="{{ profile.phone|default:'' }}" placeholder="+20 100 000 0000">
        </div>
        <div class="form-field">
          <label for="city" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">City / Region</label>
          <input type="text" name="city" id="city" class="form-input" value="{{ profile.city|default:'' }}" placeholder="e.g. Cairo, New Cairo">
        </div>
      </div>

      <div class="form-field" style="margin-bottom: 16px;">
        <label for="address" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">Shipping & Delivery Address</label>
        <textarea name="address" id="address" class="form-input" rows="3" placeholder="Building, Street, Apartment or Villa details" style="resize: vertical;">{{ profile.address|default:'' }}</textarea>
      </div>

      <div class="form-field" style="margin-bottom: 24px;">
        <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">Username (Unique Identifier)</label>
        <input type="text" class="form-input" value="{{ user.username }}" disabled style="opacity: 0.5; cursor: not-allowed; background: rgba(0,0,0,0.2);">
      </div>

      <div style="display: flex; gap: 14px; margin-top: 10px;">
        <button type="submit" class="btn-primary" style="flex: 1; padding: 13px; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Save Changes
        </button>
        <a href="{% url 'my_account' %}" class="btn-secondary" style="padding: 13px 24px; font-size: 0.95rem;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
