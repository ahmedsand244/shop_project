{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | NEXUS STORE{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding: 50px 20px 80px;">
  <div class="checkout-form-card" style="box-shadow: var(--shadow-lg); text-align: center;">

    <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    </div>

    <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 10px;">Password Reset Successful</h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
      Your account password has been updated securely. You can now sign in using your new credentials.
    </p>

    <a href="{% url 'login' %}" class="btn-primary" style="width: 100%; padding: 13px; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; gap: 8px;">
      <span>Sign In Now</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>

  </div>
</div>
{% endblock %}
